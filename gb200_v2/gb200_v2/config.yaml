constraints:
  max_compliance_ratio: 1.05
  max_displacement: 1.0
  min_safety_factor: 1.5
data:
  length_unit: meters
  resolution: 128
  runs_dir: data/runs_real_128
  split_by_design_family: true
  test_split: 0.1
  train_split: 0.8
  use_sdf: false
  val_split: 0.1
load_cases:
- gravity
- wind
- combined
loss:
  log_transform: null
  target_weights:
    compliance: 0.5
    max_displacement: 1.0
    max_von_mises: 1.0
    min_safety_factor: 1.5
  type: huber
  winsorize_pct: 2.0
materials:
- concrete
- mortar
- polymer
model:
  backbone: resnet3d
  base_channels: 64
  drop_path: 0.1
  dropout: 0.15
  n_models: 5
  type: ensemble
optimization:
  parameterization:
    erosion_max: 0.3
    erosion_min: 0.0
    smooth_max: 0.2
    smooth_min: 0.0
  search:
    constraint_penalty: 100.0
    iterations: 100
    mc_samples: 16
    population_size: 32
    sigma0: 0.3
    surface_area_weight: 0.01
    thin_feature_weight: 0.1
    uncertainty_k: 2.0
parts:
  exterior_wall:
    editable: thickness_only
    shell_thickness_voxels: 3
  floor:
    editable: limited
    protected_zones: true
  interior_wall:
    editable: full
    min_thickness: 0.02
  roof:
    editable: full
    min_thickness: 0.015
project: fea_voxel_surrogate_v2
targets:
- max_von_mises
- max_displacement
- min_safety_factor
- compliance
training:
  batch_size: 32
  compile: false
  ema_decay: 0.999
  epochs: 200
  grad_clip: 1.0
  lr: 0.0005
  mixed_precision: true
  patience: 30
  seed: 42
  use_ema: true
  weight_decay: 0.0001
validation:
  max_components: 1
  min_thickness_voxels: 2.0
  thin_threshold_voxels: 1.5

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sasto-v"
version = "0.1.0"
description = "SASTO-V evidence-contract bootstrap"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<3",
]

[dependency-groups]
test = [
    "pytest>=8,<9",
]
fea = [
    "scipy==1.17.1",
    "pyamg==5.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

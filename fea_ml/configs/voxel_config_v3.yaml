# FEA Voxel Surrogate Configuration  (v3 – clean data + weighted loss + R² monitoring)
#
# Changes from v2:
#   - Data filtered via clean_manifest.json (21.8% diverged FEA removed)
#   - Dropped min_safety_factor (99.8% anti-correlated with max_von_mises)
#   - target_weights now properly passed to ensemble training
#   - winsorize_pct applied correctly
#   - Per-target R² logged every epoch for training validation

project: fea_voxel_surrogate_v3

data:
  runs_dir: data/runs_real_128       # 128³ voxels
  resolution: 128
  use_sdf: false
  length_unit: meters
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  split_by_design_family: true

parts:
  exterior_wall:
    editable: thickness_only
    shell_thickness_voxels: 3
  interior_wall:
    editable: full
    min_thickness: 0.02
  roof:
    editable: full
    min_thickness: 0.015
  floor:
    editable: limited
    protected_zones: true

# Dropped min_safety_factor — it's yield_stress / max_von_mises, perfectly redundant
targets:
  - max_von_mises
  - max_displacement
  - compliance

materials:
  - concrete
  - mortar
  - polymer

load_cases:
  - gravity
  - wind
  - combined

constraints:
  min_safety_factor: 1.5
  max_displacement: 1.0
  max_compliance_ratio: 1.05

model:
  type: ensemble
  n_models: 5
  backbone: resnet3d
  dropout: 0.15
  drop_path: 0.1
  base_channels: 64

training:
  batch_size: 32
  epochs: 200
  lr: 0.0005
  weight_decay: 0.0001
  seed: 42
  mixed_precision: true
  grad_clip: 1.0
  patience: 30
  use_ema: true
  ema_decay: 0.999
  compile: false

loss:
  type: huber
  log_transform: null           # null = ALL targets get log1p transform
  winsorize_pct: 2.0            # clip 2nd/98th percentile in log space
  target_weights:
    max_von_mises: 1.0
    max_displacement: 1.5       # displacement critical for optimization constraints
    compliance: 1.0

optimization:
  parameterization:
    erosion_min: 0.0
    erosion_max: 0.3
    smooth_min: 0.0
    smooth_max: 0.2
  search:
    iterations: 100
    population_size: 32
    sigma0: 0.3
    surface_area_weight: 0.01
    thin_feature_weight: 0.1
    constraint_penalty: 100.0
    uncertainty_k: 2.0
    mc_samples: 16

validation:
  min_thickness_voxels: 2.0
  max_components: 1

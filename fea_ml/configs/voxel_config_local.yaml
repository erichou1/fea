# Local training config: 64³ resolution, single GPU (RTX A3000 6GB)
# Uses full 14K dataset at 64³ with smaller batch to fit VRAM

project: fea_voxel_surrogate_v2_local

data:
  runs_dir: data/runs_real
  resolution: 64
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  split_by_design_family: true
  use_sdf: false
  length_unit: meters

targets:
  - max_von_mises
  - max_displacement
  - min_safety_factor
  - compliance

materials:
  - concrete
  - mortar
  - polymer

load_cases:
  - gravity
  - wind
  - combined

model:
  type: ensemble
  n_models: 3            # 3 members instead of 5 (faster locally)
  backbone: cnn3d        # smaller model for 64³
  base_channels: 32
  dropout: 0.15
  drop_path: 0.1

training:
  epochs: 100            # fewer epochs locally
  batch_size: 8          # fits 6GB VRAM
  lr: 0.0005
  weight_decay: 0.0001
  mixed_precision: true
  seed: 42
  grad_clip: 1.0
  patience: 25
  use_ema: true
  ema_decay: 0.999
  compile: false

loss:
  type: huber
  log_transform: null    # null = log1p ALL targets
  winsorize_pct: 2.0
  target_weights:
    max_von_mises: 1.0
    max_displacement: 1.0
    min_safety_factor: 1.5
    compliance: 0.5

constraints:
  min_safety_factor: 1.5
  max_displacement: 1.0
  max_compliance_ratio: 1.05

parts:
  exterior_wall:
    editable: thickness_only
    shell_thickness_voxels: 3
  interior_wall:
    editable: full
    min_thickness: 0.02
  roof:
    editable: full
    min_thickness: 0.015
  floor:
    editable: limited
    protected_zones: true

optimization:
  parameterization:
    erosion_min: 0.0
    erosion_max: 0.3
    smooth_min: 0.0
    smooth_max: 0.2
  search:
    iterations: 100
    population_size: 32
    sigma0: 0.3
    surface_area_weight: 0.01
    thin_feature_weight: 0.1
    constraint_penalty: 100.0
    uncertainty_k: 2.0
    mc_samples: 16

validation:
  min_thickness_voxels: 2.0
  max_components: 1
  thin_threshold_voxels: 1.5
